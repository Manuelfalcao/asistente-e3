name: CI

on:
  push:
    branches: [main]

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:archivo
      - uses: actions/upload-artifact@v4
        with:
          name: pwa
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: html-unico
          path: dist-archivo/index.html
      # Con Vitest en rojo o un caso sin test el informe se escribe igual, y es justo el que hay que
      # mirar: por eso corre y se sube aunque algún paso anterior haya fallado.
      - run: npm run informe
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: informe-de-casos
          path: dist-informe/informe.html
