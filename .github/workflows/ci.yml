name: CI

on:
  push:
    branches: [main]

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:archivo
      - uses: actions/upload-artifact@v4
        with:
          name: pwa
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: html-unico
          path: dist-archivo/index.html
